# Continuous integration for crawcus/crawcus.
# Actions are pinned to commit SHAs.
#   actions/checkout@v4.2.2
#   pnpm/action-setup@v4.1.0
#   actions/setup-node@v4.4.0
#   actions/setup-python@v5.6.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve through dist/. Build before typecheck
      # and test so a clean checkout matches local `pnpm build && pnpm test`.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm run --if-present lint

      - name: Test
        run: pnpm test

  docs:
    name: mkdocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.6.15"

      - name: Build docs
        run: mkdocs build --strict
